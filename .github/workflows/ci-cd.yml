name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Read release id
        id: manifest
        run: |
          echo "release_id=$(node -e "console.log(require('./dist/release-manifest.json').releaseId)")" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: screeps-${{ steps.manifest.outputs.release_id }}
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to Screeps
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: screeps-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          pattern: screeps-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded artifact
        run: node scripts/verify-release.mjs dist/release-manifest.json

      - name: Deploy to Screeps agentic branch
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          SCREEPS_BRANCH: agentic
          SCREEPS_SHARD: ${{ vars.SCREEPS_SHARD }}
        run: npm run deploy:live

      - name: Summary
        run: |
          echo "Screeps branch: agentic" >> "$GITHUB_STEP_SUMMARY"
          echo "Main is the production gate; this workflow deployed after verification." >> "$GITHUB_STEP_SUMMARY"
