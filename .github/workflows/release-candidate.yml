name: Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screeps-agentic-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: screeps-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify and build
        run: npm run verify

      - name: Read release id
        id: manifest
        run: |
          echo "release_id=$(node -e "console.log(require('./dist/release-manifest.json').releaseId)")" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: screeps-${{ steps.manifest.outputs.release_id }}
          path: dist/
          if-no-files-found: error

      - name: Deploy to Screeps agentic branch
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}
          SCREEPS_BRANCH: agentic
          SCREEPS_SHARD: ${{ vars.SCREEPS_SHARD }}
        run: npm run deploy:live

      - name: Summary
        run: |
          echo "Release: ${{ steps.manifest.outputs.release_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Screeps branch: agentic" >> "$GITHUB_STEP_SUMMARY"
          echo "Main is the production gate; this workflow auto-deployed after verification." >> "$GITHUB_STEP_SUMMARY"
